<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Data Structure Simulator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>

    <script src="queue.js"></script>

    <link href="style.css" rel="stylesheet">
</head>

<body>

<div class="container col-sm-6">

    <div class="row">
        <h1 class="display-7 p-3 mb-1 text-center text-bg-dark">
            Queue Data Structure Simulator
        </h1>
    </div>

    <div class="row text-bg-success p-3 mb-1">
        <div class="col text-center fs-4">Operations</div>
        <div class="col text-center fs-4">Queue Data</div>
        <div class="col text-center fs-4">Removed From Queue</div>
    </div>

    <div class="row bg-danger">

        <div class="col">

            <div class="d-grid gap-1 col mx-auto">

                <input
                    type="text"
                    id="st_data"
                    class="form-control text-center mt-2"
                    placeholder="Enter Value">

                <button id="btn_enqueue" class="btn btn-success">
                    Enqueue
                </button>

                <button id="btn_dequeue" class="btn btn-danger">
                    Dequeue
                </button>

                <button id="btn_peek" class="btn btn-warning">
                    Peek Front
                </button>

                <button id="btn_clear" class="btn btn-light">
                    Clear
                </button>

            </div>

        </div>

        <div id="stack" class="col bg-dark"></div>

        <div id="popped" class="col popped bg-dark"></div>

    </div>

</div>

</body>
</html>
